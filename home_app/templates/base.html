{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mosque Management</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-100">
    <!-- Sidebar -->
    <div class="flex h-screen">
        <div id="sidebar" class="bg-gray-800 text-white w-64 space-y-6 py-7 px-2 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out">
            <h2 class="text-2xl font-semibold text-center">Mosque Management</h2>
            <nav>
                <a href="{% url 'dashboard' %}" class="block py-2.5 px-4 rounded hover:bg-gray-700">Dashboard</a>
                <a href="{% url 'members' %}" class="block py-2.5 px-4 rounded hover:bg-gray-700">Members</a>
                <a href="{% url 'donations' %}" class="block py-2.5 px-4 rounded hover:bg-gray-700">Donations</a>
                <a href="{% url 'subscriptions' %}" class="block py-2.5 px-4 rounded hover:bg-gray-700">Subscriptions</a>
                <a href="{% url 'expenses' %}" class="block py-2.5 px-4 rounded hover:bg-gray-700">Expenses</a>
                <a href="{% url 'imam_salary' %}" class="block py-2.5 px-4 rounded hover:bg-gray-700">Imam Salary</a>
                <a href="{% url 'reports' %}" class="block py-2.5 px-4 rounded hover:bg-gray-700">Reports</a>
            </nav>
        </div>
        <!-- Main Content -->
        <div class="flex-1 p-10">
            <button id="sidebarToggle" class="md:hidden p-2 bg-gray-800 text-white rounded">Toggle Sidebar</button>
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <script>
        document.getElementById('sidebarToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        });
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
