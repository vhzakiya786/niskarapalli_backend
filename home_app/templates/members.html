{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Manage Members</h1>

    <!-- Member Form -->
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        <div class="flex flex-wrap -mx-2">
            <div class="w-full md:w-1/2 px-2 mb-4">
                <label for="id_name" class="block text-sm font-medium text-gray-700">Name</label>
                {{ form.name }}
            </div>
            <div class="w-full md:w-1/2 px-2 mb-4">
                <label for="id_phone_number" class="block text-sm font-medium text-gray-700">Phone Number</label>
                {{ form.phone_number }}
            </div>
            <div class="w-full md:w-1/2 px-2 mb-4">
                <label for="id_email" class="block text-sm font-medium text-gray-700">Email</label>
                {{ form.email }}
            </div>
        </div>
        <div class="flex space-x-4">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Save</button>
            <a href="{% url 'dashboard' %}" class="bg-gray-500 text-white px-4 py-2 rounded">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
